[platformio]
default_envs = rear, front

[env]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
build_flags = -Wall -Wextra

[env:rear]
build_flags = ${env.build_flags} -DROLE_REAR=1

[env:front]
build_flags = ${env.build_flags} -DROLE_FRONT=1
lib_ignore = SparkFun VL53L5CX Arduino Library

