[platformio]
default_envs = rear

[env:rear]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../door-guard/lib

[env:ranging]
platform = espressif32@8.0.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
lib_extra_dirs = ../door-guard/lib
build_flags = -DENABLE_RANGING=1

