<text x="1150" y="657" style="font-size:18px;fill:#ffffff">暂不连接*</text>
<text x="1000" y="739" style="font-size:21px;fill:#a26210">本图采用3.3V联调；5V脚不接。</text>
<rect x="30" y="810" width="1440" height="205" rx="14" fill="#ffffff" stroke="#dce4ec"/>
<text x="60" y="854" style="font-size:25px;fill:#20354b">逐根核对</text>
<text x="60" y="896" style="font-size:24px;fill:#c33935">3V3 → VIN</text>
<text x="410" y="896" style="font-size:24px;fill:#20354b">GND → GND</text>
<text x="760" y="896" style="font-size:24px;fill:#2679d6">D4 → SDA</text>
<text x="1110" y="896" style="font-size:24px;fill:#9854be">D5 → SCL</text>
<text x="60" y="941" style="font-size:22px;fill:#a26210">* 电源为3.3V初步联调方案，不能仅凭照片确认整板额定参数；勿改接5V。</text>
<text x="60" y="980" style="font-size:21px;fill:#20354b">INT留空；LPn先留空，若通信扫描失败再核对其上拉电路。未验证实际测距。</text>
<text x="55" y="1045" style="font-size:21px;fill:#20354b">两块主板之间使用ESP-NOW无线通信，不接导线、不共地；改接线前断开USB。</text>
